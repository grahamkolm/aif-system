<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1"> <meta name="theme-color" content="#05080d">

<link rel="manifest" href="manifest.json"> <link rel="icon" href="icon.png"> <link rel="apple-touch-icon" href="icon.png">

<title>AIF Dashboard</title>

<!-- LIBS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<!-- CSS -->
<link rel="stylesheet" href="styles.css?v=5">

</head>

<body>

<!-- ================= ROOT ================= --> <div id="appRoot">

<!-- ================= BACKGROUND FX ================= --> <canvas id="aifCanvas"></canvas>

<!-- ================= SPLASH ================= --> <div id="splash">
    <canvas id="splashCanvas"></canvas>
    <div class="splash-loader"></div>
</div>

<!-- ================= MAIN APP ================= --> <div class="main">

<!-- HEADER -->
<div class="header">
    <div class="brand">AIF™</div>
    <div class="subtitle1">Artificial Intelligence Fishing</div>
    <div class="subtitle2">Drop • Scan • Strike</div> </div>

<!-- SPI -->
<div class="instrument">
  <div class="spi-container">

    <svg viewBox="0 0 300 300">

      <circle cx="150" cy="150" r="110"
        stroke="#2f4f4f"
        stroke-width="10"
        fill="none"
        stroke-dasharray="8 12"/>

      <circle id="spiArc"
        cx="150"
        cy="150"
        r="110"
        stroke="var(--primary)"
        stroke-width="14"
        fill="none"
        stroke-linecap="round"
        transform="rotate(-90 150 150)"/>

      <text x="150" y="145"
        text-anchor="middle"
        class="spi-number"
        id="spiValue">--%</text>

      <text x="150" y="175"
        text-anchor="middle"
        fill="#b9c3cc">SPI</text>

    </svg>

  </div>
</div>

<!-- MINI CIRCLES -->
<div style="display:flex; justify-content:center; gap:20px; margin-top:10px;">
    <div id="envCircle">ENV 50%</div>
    <div id="confCircle">CONF 50%</div>
</div>

<!-- TACTICAL -->
<div id="tacticalBar" class="tactical-bar">
    Waiting for environmental data...
</div>

<div id="tactical"></div>

<!-- WATER CARD -->
<div class="card">
    <div class="card-title">Water Intelligence</div>

    <div class="temp-row">
        <span>AIR</span>
        <span id="wcAir">--°C</span>
    </div>

    <div class="temp-row main">
        <span>SURFACE</span>
        <span id="wcSurface">--°C</span>
    </div>

    <div class="temp-row">
        <span>BOTTOM</span>
        <span id="wcBottom">--°C</span>
    </div>

    <canvas id="waterGraph"></canvas>
</div>

<!-- CONDITIONS -->
<div class="card">
  <div class="card-title">Conditions</div>

  <div class="cond-grid">

    <div class="cond-item">
      <label>Pressure</label>
      <b id="pressure">--</b>
    </div>

    <div class="cond-item">
      <label>Wind</label>
      <b id="wind">--</b>
    </div>

    <div class="cond-item">
      <label>Cloud</label>
      <b id="cloud">--</b>
    </div>

    <div class="cond-item">
      <label>Oxygen</label>
      <b id="oxygen">--</b>
    </div>

  </div>
</div>

<!-- AI -->
<div class="ai-box" onclick="openAIDetail()">
  <b>AI Tactical Analysis</b>
  <div id="aiAnalysis"></div>
</div>

</div>

<!-- ================= DOCK ================= --> <div class="dock">

<div class="dock-btn" onclick="refreshData()"> <i data-lucide="refresh-cw"></i> <span>Refresh</span> </div>

<div class="dock-btn" onclick="openScout()">Scout</div> <div class="dock-btn" onclick="confirmDrop()">Drop</div>
<div class="dock-btn" onclick="openMap()">Map</div> <div class="dock-btn" onclick="openPlan()">Plan</div> <div class="dock-btn" onclick="openReport()">Report</div>

</div>

<!-- ================= MAP ================= --> <div id="mapScreen" class="hidden safe-layer">
    <div class="map-header">
        <span>Map</span>
        <button onclick="closeMap()">✕</button>
    </div>
    <div id="map"></div>
</div>

</div>

<!-- JS -->
<script src="app.js"></script>

</body>
</html>
