<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>AIF</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<!-- 🌊 BACKGROUND -->
<div class="bg"></div>

<!-- 🚀 SPLASH -->
<div id="splash">
    <div class="splash-content">
        <div class="logo"></div>
        <div class="loader">
            <div class="bar"></div>
        </div>
    </div>
</div>

<!-- 🧠 MAIN -->
<div id="main" class="hidden">

    <div class="header">
        <div class="brand">AIF™</div>
        <div class="subtitle1">Artificial Intelligence Fishing</div>
        <div class="subtitle2">Drop • Scan • Strike</div>
    </div>

</div>

<script>
setTimeout(() => {
    document.getElementById("splash").style.display = "none";
    document.getElementById("main").classList.remove("hidden");
}, 2000);
</script>

</body>
</html>
